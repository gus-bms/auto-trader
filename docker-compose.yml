services:
  mysql:
    image: mysql:8.4
    container_name: auto-trader-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auto_trader
      MYSQL_USER: auto_trader
      MYSQL_PASSWORD: auto_trader_dev
      MYSQL_ROOT_PASSWORD: root_dev_only
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_dev_only"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7.4
    container_name: auto-trader-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
